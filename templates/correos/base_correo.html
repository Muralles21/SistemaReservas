<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#eef3f0;font-family:Arial,Helvetica,sans-serif;color:#17231e}
.wrap{max-width:560px;margin:0 auto;padding:24px 14px}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #dbe6e0}
.head{background:#0b6b4d;color:#fff;padding:20px 24px;font-size:18px;font-weight:bold}
.body{padding:24px;line-height:1.55;font-size:15px}
.tabla{width:100%;border-collapse:collapse;margin:16px 0}
.tabla td{padding:9px 0;border-bottom:1px solid #e6eee9;font-size:14px}
.tabla td:first-child{color:#5b6b64;width:38%}
.btn{display:inline-block;background:#0b6b4d;color:#fff !important;text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:bold}
.pie{color:#7a8a83;font-size:12px;text-align:center;padding:16px 8px}
.aviso{background:#fff7e6;border:1px solid #f3d9a4;border-radius:10px;padding:12px 14px;font-size:14px}
</style></head><body><div class="wrap"><div class="card">
<div class="head">{{ NOMBRE_SISTEMA }}</div>
<div class="body">
{% block cuerpo %}{% endblock %}
</div></div>
<div class="pie">Este es un mensaje automático de {{ NOMBRE_SISTEMA }}. Por favor no respondas a este correo.</div>
</div></body></html>
