{% if messages %}
<div class="mb-3" aria-live="polite">
  {% for message in messages %}
  <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %} alert-dismissible fade show" role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}" style="border-radius:12px;">
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar aviso"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
