{# Lado derecho del encabezado; el titulo de la pagina lo pinta base.html #}
<div class="d-flex align-items-center gap-2">
  <a href="{% url 'autenticacion:cambiar_password' %}" class="topbar-icono text-secondary" title="Cambiar contraseña" aria-label="Cambiar contraseña">
    <i class="bi bi-key" aria-hidden="true"></i>
  </a>
  <div class="dropdown">
    <button class="btn d-flex align-items-center gap-2 border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menú de usuario">
      <span class="avatar-circulo" aria-hidden="true">{{ user.first_name|default:user.username|first|upper }}</span>
      <span class="d-none d-sm-inline text-secondary" style="font-size:14px;">{{ user.get_full_name|default:user.username }}</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end">
      <li><span class="dropdown-item-text small">{{ user.rol.nombre|default:"Sin rol asignado" }}</span></li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <form method="post" action="{% url 'autenticacion:logout' %}">
          {% csrf_token %}
          <button type="submit" class="dropdown-item text-danger">
            <i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i> Cerrar sesión
          </button>
        </form>
      </li>
    </ul>
  </div>
</div>
