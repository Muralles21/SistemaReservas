<header class="topbar">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm btn-outline-elegante d-md-none" onclick="document.getElementById('sidebar').classList.toggle('abierto')">
      <i class="bi bi-list"></i>
    </button>
    <span class="titulo-pagina">{% block titulo_pagina %}Panel{% endblock %}</span>
  </div>
  <div class="d-flex align-items-center gap-3">
    <a href="{% url 'autenticacion:cambiar_password' %}" class="text-secondary" title="Cambiar contraseña" style="font-size:18px;">
      <i class="bi bi-key"></i>
    </a>
    <div class="dropdown">
      <button class="btn d-flex align-items-center gap-2 border-0" type="button" data-bs-toggle="dropdown">
        <span class="avatar-circulo">{{ user.first_name|default:user.username|first|upper }}</span>
        <span class="d-none d-sm-inline text-secondary" style="font-size:14px;">{{ user.get_full_name|default:user.username }}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><span class="dropdown-item-text text-muted small">{{ user.rol.nombre|default:"Sin rol asignado" }}</span></li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <form method="post" action="{% url 'autenticacion:logout' %}">
            {% csrf_token %}
            <button type="submit" class="dropdown-item text-danger">
              <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</header>
