{% extends 'base.html' %}
{% block contenido_publico %}
<div class="login-shell">
  <div class="login-card">
    {% include 'partials/auth_marca.html' %}
    <h5 class="mb-3" style="font-weight:600;">Recuperar contraseña</h5>
    <p class="text-secondary small">Ingresa tu correo y te enviaremos instrucciones para restablecerla.</p>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">{{ form.email }}</div>
      <button type="submit" class="btn btn-primario w-100">Enviar instrucciones</button>
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'autenticacion:login' %}" class="small text-secondary">Volver al inicio de sesión</a>
    </div>
  </div>
</div>
{% endblock %}
