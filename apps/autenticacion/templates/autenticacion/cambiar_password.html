{% extends 'base.html' %}
{% block titulo_pagina %}Cambiar contraseña{% endblock %}
{% block contenido %}
<div class="card-elegante p-4" style="max-width:480px;">
  <h5 class="mb-3" style="font-weight:600;">Cambiar contraseña</h5>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Contraseña actual</label>
      {{ form.old_password }}
    </div>
    <div class="mb-3">
      <label class="form-label">Nueva contraseña</label>
      {{ form.new_password1 }}
    </div>
    <div class="mb-3">
      <label class="form-label">Confirmar nueva contraseña</label>
      {{ form.new_password2 }}
    </div>
    <button type="submit" class="btn btn-primario">Actualizar contraseña</button>
  </form>
</div>
{% endblock %}
